<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Student Login | DanLa WeCare Hub</title>
  <meta name="description" content="Student login page for DanLa WeCare Hub.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">S</span>
        <div>
          <p class="eyebrow">Student Portal</p>
          <p class="eyebrow" data-inst="name" data-inst-fallback="DanLa WeCare Hub">DanLa WeCare Hub</p>
          <h1>Student Sign In</h1>
        </div>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
      </nav>
    </header>

    <main class="auth-shell">
      <section class="auth-panel">
        <div class="auth-header">
          <p class="eyebrow">Google sign-in</p>
          <h2>Sign in with your student Google account</h2>
          <p>Only pre-registered students may access the student dashboard. Unregistered accounts will be directed to contact the administrator.</p>
        </div>

        <button id="student-signin-button" class="button button-primary" type="button">Sign in with Google</button>
        <p id="student-signin-status" class="status-text" aria-live="polite"></p>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 DanLa WeCare Hub. Student access only.</p>
    </footer>
  </div>

  <script src="js/student-auth.js" defer></script>
</body>
</html>
