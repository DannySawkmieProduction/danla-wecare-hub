name = "danla-wecare-hub"
compatibility_date = "2026-08-05"

# Cloudflare Pages project (static site root, no build step required).
pages_build_output_dir = "."

# D1 database binding, available to functions/api/[[path]].js as env.DB
[[d1_databases]]
binding = "DB"
database_name = "danla_wecare_hub"
database_id = "8c9917b5-f90c-4e20-a299-71575ff5ec23"

# R2 bucket binding, available to functions/api/[[path]].js as env.R2_BUCKET
[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "danla-wecare-files"

# Non-secret configuration values only.
# ADMIN_PASSWORD_HASH and UPLOAD_API_KEY are NOT defined here — they are
# secrets and must be set with `wrangler pages secret put <NAME>` or via
# the Cloudflare Dashboard (Pages project -> Settings -> Environment variables
# -> Encrypt), never committed to this file.
[vars]
ADMIN_USERNAME = "admin"
STUDENT_GOOGLE_CLIENT_ID = "REPLACE_WITH_STUDENT_GOOGLE_CLIENT_ID"
TEACHER_GOOGLE_CLIENT_ID = "REPLACE_WITH_TEACHER_GOOGLE_CLIENT_ID"
R2_BUCKET_NAME = "danla-wecare-files"
MAX_UPLOAD_SIZE = "52428800"
