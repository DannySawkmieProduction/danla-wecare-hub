<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Class Management | DanLa WeCare Hub</title>
  <meta name="description" content="Manage academic classes within the administrator portal.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">C</span>
        <div>
          <p class="eyebrow">Admin Portal</p>
          <h1>Class Management</h1>
        </div>
      </div>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="admin-departments.html">Departments</a>
        <a href="admin-subjects.html">Subjects</a>
        <a href="admin-students.html">Students</a>
        <a href="admin-faculty.html">Faculty</a>
        <a href="admin-timetable.html">Timetable</a>
        <a href="admin-attendance.html">Attendance</a>
        <a href="index.html">Home</a>
        <button id="admin-logout-button" class="button button-secondary" type="button">Sign out</button>
      </nav>
    </header>

    <main class="auth-shell class-shell">
      <section class="class-panel">
        <div class="class-header">
          <div>
            <p class="eyebrow">Class toolkit</p>
            <h2>Manage academic classes</h2>
            <p>Create, update, search, and remove classroom groups with department and subject linkage.</p>
          </div>
          <button id="new-class-button" class="button button-primary">New Class</button>
        </div>

        <div class="class-search">
          <label for="class-search-input">Search classes</label>
          <input id="class-search-input" type="search" placeholder="Search by class name, code, department, subject, teacher, or status">
        </div>

        <div class="class-list" id="class-list"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 DanLa WeCare Hub. Administrator class management.</p>
    </footer>
  </div>

  <script src="js/admin-auth.js" defer></script>
  <script src="js/admin-classes.js" defer></script>
</body>
</html>
